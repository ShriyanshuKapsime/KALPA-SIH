services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with PostGIS & pgvector
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kalpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalpa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ai-service/app/database/init_extensions.sql:/docker-entrypoint-initdb.d/init_extensions.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kalpa}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kalpa-network

  # ----------------------------------------------------------------------------
  # Python + FastAPI AI Backend Service
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: kalpa-ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-kalpa}
      - POSTGIS_ENABLED=${POSTGIS_ENABLED:-true}
      - PGVECTOR_ENABLED=${PGVECTOR_ENABLED:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_STT_MODEL=${SARVAM_STT_MODEL:-saaras:v4}
      - SARVAM_LLM_MODEL=${SARVAM_LLM_MODEL:-sarvam-105b}
      - SARVAM_LLM_ENABLED=${SARVAM_LLM_ENABLED:-true}
    volumes:
      - ./ai-service:/app
    ports:
      - "8000:8000"
    # Development: hot-reload on file changes
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - kalpa-network

  # ----------------------------------------------------------------------------
  # Node.js Express API Gateway
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: kalpa-gateway
    restart: unless-stopped
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./gateway:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    # Development: hot-reload on file changes
    command: ["node", "--watch", "src/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "const req = require('http').get('http://127.0.0.1:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - kalpa-network

  # ----------------------------------------------------------------------------
  # React.js Vite Frontend (Production Preview / Container)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kalpa-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:3000/api
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - kalpa-network

volumes:
  postgres_data:
    driver: local

networks:
  kalpa-network:
    driver: bridge
